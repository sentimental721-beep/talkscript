const key='intech-roleplay-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch{};
const root=document.getElementById('script');const refs=[];
function el(tag,cls,text){let e=document.createElement(tag);e.className=cls||'';if(text)e.textContent=text;return e}
sections.forEach((s,i)=>{const card=el('section','item');card.append(el('h2','label-title',s.title),el('div','talk',s.text));const qs=[];s.questions.forEach(question=>{const box=el('div');const label=el('label','talk',question.label);label.htmlFor=question.id;const select=el('select');select.id=question.id;select.append(new Option('選択してください',''));question.options.forEach((o,n)=>select.append(new Option(o.label,String(n))));select.value=state[question.id]??'';const answer=el('div','answer');answer.setAttribute('aria-live','polite');select.onchange=()=>{state[question.id]=select.value;let clear=false;for(const r of refs)for(const x of r.qs){if(clear){delete state[x.question.id];x.select.value=''}if(x.question.id===question.id)clear=true}try{localStorage.setItem(key,JSON.stringify(state))}catch{}update()};box.append(label,select,answer);card.append(box);qs.push({box,select,answer,question})});root.append(card);refs.push({card,qs})});
function active(id){if(id==='future')return state.internet==='1';if(id==='price')return state.modem==='0';if(id==='tvs')return state.tv==='1';if(id==='antenna')return state.tv==='1'&&state.tvs==='1';return true}
function update(){let blocked=false;refs.forEach(r=>{r.card.hidden=blocked;if(blocked)return;r.qs.forEach(x=>{x.box.hidden=blocked||!active(x.question.id);if(x.box.hidden)return;const v=x.select.value;const o=v===''?null:x.question.options[Number(v)];x.answer.hidden=!o;x.answer.textContent=o?.text||'';x.answer.classList.toggle('end',!!o?.stop);if(!o||o.stop)blocked=true})})}update();
document.getElementById('reset').onclick=()=>{if(!confirm('選択内容を消して最初からやり直しますか？'))return;state={};try{localStorage.removeItem(key)}catch{}refs.forEach(r=>r.qs.forEach(x=>x.select.value=''));update();window.scrollTo({top:0,behavior:'smooth'})};
